name: CI / Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  contracts:
    name: Sui Move Smart Contracts Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Sui CLI
        run: |
          mkdir -p $HOME/.sui/bin
          wget -q https://github.com/MystenLabs/sui/releases/download/testnet-v1.34.0/sui-testnet-v1.34.0-ubuntu-x86_64.tgz
          tar -xzf sui-testnet-v1.34.0-ubuntu-x86_64.tgz -C $HOME/.sui/bin
          echo "$HOME/.sui/bin" >> $GITHUB_PATH

      - name: Run Move Unit & Integration Tests
        run: |
          sui move test --path contracts

  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm --prefix frontend install

      - name: Run Build & Typecheck
        run: npm --prefix frontend run build
